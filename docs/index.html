<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jini ATS 3.0 · iOS 27 Edition</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
 --bg:#f4f7fb;--glass:rgba(255,255,255,.70);--glass2:rgba(255,255,255,.82);
 --text:#0f172a;--muted:#667085;--line:rgba(255,255,255,.72);
 --blue:#4f7cff;--indigo:#6d5dfc;--green:#17b26a;--amber:#f79009;--red:#f04438;
 --shadow:0 18px 45px rgba(68,76,104,.12);--radius:26px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,sans-serif;color:var(--text)}
body{
 background:
 radial-gradient(circle at 12% 12%,rgba(121,143,255,.22),transparent 28%),
 radial-gradient(circle at 88% 18%,rgba(255,170,202,.18),transparent 24%),
 radial-gradient(circle at 72% 78%,rgba(92,214,192,.18),transparent 24%),
 linear-gradient(135deg,#eef3fb,#f8fbff 50%,#f7f5ff);
 background-attachment:fixed;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{display:flex;min-height:100vh}
.sidebar{
 width:255px;padding:18px 14px;position:sticky;top:0;height:100vh;
 background:rgba(241,246,255,.62);backdrop-filter:blur(28px) saturate(1.2);
 border-right:1px solid rgba(255,255,255,.72);box-shadow:12px 0 34px rgba(77,86,120,.08)
}
.brand{display:flex;align-items:center;gap:11px;padding:9px 10px 22px}
.brand-logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#5d73ff,#7657ff);box-shadow:0 10px 24px rgba(92,84,255,.28);position:relative}
.brand-logo:before,.brand-logo:after{content:"";position:absolute;background:white;border-radius:999px;transform:rotate(-35deg)}
.brand-logo:before{width:8px;height:24px;left:10px;top:9px}.brand-logo:after{width:8px;height:26px;right:10px;top:7px}
.brand-title{font-size:20px;font-weight:900;letter-spacing:-.6px}.brand-sub{font-size:10px;color:var(--muted);margin-top:2px}
.nav{display:grid;gap:7px}
.nav button{
 border:0;background:transparent;text-align:left;padding:13px 14px;border-radius:16px;color:#475467;font-weight:750;display:flex;align-items:center;gap:11px
}
.nav button:hover{background:rgba(255,255,255,.55)}
.nav button.active{background:rgba(255,255,255,.84);color:#315df6;box-shadow:0 8px 24px rgba(90,100,140,.11);border:1px solid rgba(255,255,255,.9)}
.nav .ico{width:24px;text-align:center}
.side-card{position:absolute;left:14px;right:14px;bottom:16px;padding:16px;border-radius:20px;background:rgba(255,255,255,.58);border:1px solid rgba(255,255,255,.78);box-shadow:0 12px 30px rgba(79,91,130,.08);font-size:11px;color:var(--muted);line-height:1.55}
.main{flex:1;min-width:0}
.topbar{
 position:sticky;top:0;z-index:30;height:80px;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 28px;
 background:rgba(247,250,255,.62);backdrop-filter:blur(26px) saturate(1.15);border-bottom:1px solid rgba(255,255,255,.8)
}
.search{width:min(460px,46vw);position:relative}.search input{width:100%;height:46px;border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.72);border-radius:15px;padding:0 16px 0 42px;outline:none;box-shadow:0 8px 22px rgba(81,92,131,.07)}
.search span{position:absolute;left:15px;top:12px;color:#667085}
.top-actions{display:flex;align-items:center;gap:10px}.btn{border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.72);padding:11px 15px;border-radius:14px;font-weight:800;color:#344054;box-shadow:0 7px 18px rgba(81,92,131,.07)}
.btn.primary{background:linear-gradient(135deg,#5c73ff,#6949f8);color:white;border:0;box-shadow:0 12px 26px rgba(84,73,244,.25)}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#e9ecff,#fff);font-weight:900;color:#5c5cdf}
.page{padding:30px;max-width:1550px;margin:auto}
.hero{display:grid;grid-template-columns:1.4fr .9fr;gap:18px;margin-bottom:18px}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(26px) saturate(1.1);box-shadow:var(--shadow);border-radius:var(--radius)}
.hero-main{padding:28px 30px;min-height:190px;position:relative;overflow:hidden}
.hero-main:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-70px;top:-105px;background:radial-gradient(circle,rgba(91,120,255,.26),rgba(118,83,255,.08) 45%,transparent 70%)}
.eyebrow{font-size:11px;font-weight:900;letter-spacing:.12em;color:#5a67d8}.hero h2{font-size:31px;line-height:1.2;margin:8px 0 8px;letter-spacing:-1.1px}.hero p{margin:0;color:var(--muted);font-size:14px}
.hero-note{padding:26px;display:flex;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden}.hero-note:before{content:"";position:absolute;inset:auto 10% 0 10%;height:90px;background:linear-gradient(135deg,rgba(127,150,255,.20),rgba(255,165,212,.22));filter:blur(16px);border-radius:50%}.hero-note strong{position:relative;font-size:18px;line-height:1.6}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.kpi{padding:19px 20px;min-height:126px}.kpi-top{display:flex;justify-content:space-between;align-items:center}.kpi-icon{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:rgba(88,115,255,.11);color:#536dfe;font-weight:900}.kpi-label{margin-top:14px;color:#475467;font-weight:750;font-size:12px}.kpi-num{font-size:31px;font-weight:900;margin-top:3px}.kpi-num small{font-size:13px;color:var(--muted);font-weight:700}.trend{font-size:10px;padding:5px 8px;border-radius:999px;background:rgba(23,178,106,.12);color:#07884e;font-weight:900}
.grid2{display:grid;grid-template-columns:1.35fr .85fr;gap:18px;margin-bottom:18px}.panel{padding:22px}.panel-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:18px}.panel-head h3{margin:0;font-size:18px}.panel-head p{margin:5px 0 0;color:var(--muted);font-size:11px}
.pipeline{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.stage{padding:13px 7px;border-radius:16px;background:rgba(255,255,255,.68);text-align:center;border:1px solid rgba(255,255,255,.88)}.stage strong{display:block;font-size:21px}.stage span{font-size:10px;color:var(--muted)}
.stage.active{background:linear-gradient(135deg,rgba(89,105,255,.90),rgba(111,78,245,.88));color:white}.stage.active span{color:#eef1ff}
.wave{height:82px;margin-top:14px;border-radius:18px;background:linear-gradient(180deg,rgba(111,132,255,.22),rgba(95,226,201,.18));clip-path:polygon(0 46%,12% 40%,26% 49%,39% 45%,54% 56%,68% 44%,83% 48%,100% 34%,100% 100%,0 100%)}
.ring-wrap{display:flex;gap:20px;align-items:center}.ring{width:126px;height:126px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#5868f6 0 84%,rgba(124,140,190,.15) 84%);position:relative;flex:none}.ring:before{content:"";position:absolute;inset:14px;border-radius:50%;background:rgba(255,255,255,.88)}.ring b{position:relative;font-size:29px}.bars{display:grid;gap:10px;flex:1}.barrow{display:grid;grid-template-columns:72px 1fr 38px;gap:8px;align-items:center;font-size:11px}.bar{height:7px;border-radius:999px;background:rgba(122,137,180,.12);overflow:hidden}.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#6473ff,#6ac7ff)}
.bottom-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 8px;text-align:left;border-bottom:1px solid rgba(150,160,190,.12);font-size:11px}.table th{color:#8a94a7;font-size:10px}.pill{padding:5px 8px;border-radius:999px;background:rgba(89,108,255,.12);color:#5362df;font-weight:800;font-size:9px}
.jobrow{display:grid;grid-template-columns:1.5fr .5fr .7fr;gap:12px;padding:12px 0;border-bottom:1px solid rgba(150,160,190,.12);align-items:center}.jobrow:last-child{border-bottom:0}.jobrow strong{font-size:12px}.jobrow span{font-size:10px;color:var(--muted)}.progress{height:7px;border-radius:999px;background:rgba(120,135,180,.12);overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#7181ff,#a78bfa);border-radius:999px}
.section-title{font-size:28px;margin:0 0 6px}.sub{color:var(--muted);font-size:13px;margin-bottom:18px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.jobcard,.candidatecard{padding:18px}.jobcard h3,.candidatecard h3{margin:0 0 8px}.meta{font-size:11px;color:var(--muted)}
.form{display:grid;gap:12px}.field{display:grid;gap:6px}.field label{font-size:11px;color:#475467;font-weight:800}.field input,.field select,.field textarea{border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.72);border-radius:14px;padding:12px;outline:none}.field textarea{min-height:130px;resize:vertical}
.modal{position:fixed;inset:0;background:rgba(37,45,71,.28);display:none;align-items:center;justify-content:center;padding:20px;z-index:80;backdrop-filter:blur(8px)}.modal.open{display:flex}.modalbox{width:min(820px,96vw);max-height:90vh;overflow:auto;padding:22px}
.toast{position:fixed;right:24px;bottom:24px;padding:12px 16px;border-radius:14px;background:#111827;color:white;opacity:0;transform:translateY(8px);transition:.2s;z-index:90}.toast.show{opacity:1;transform:none}
.mobile-nav{display:none}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2,.hero{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.sidebar{display:none}.topbar{padding:10px 12px;height:68px}.search{display:none}.page{padding:16px 14px 92px}.kpis{grid-template-columns:repeat(2,1fr);gap:10px}.kpi{padding:15px}.pipeline{grid-template-columns:repeat(3,1fr)}.bottom-grid,.cards{grid-template-columns:1fr}.hero h2{font-size:25px}.hero-main,.hero-note{padding:20px}.top-actions .hide-mobile{display:none}.mobile-nav{display:grid;position:fixed;z-index:70;left:8px;right:8px;bottom:8px;grid-template-columns:repeat(6,1fr);padding:7px;border-radius:22px;background:rgba(255,255,255,.78);backdrop-filter:blur(28px);border:1px solid rgba(255,255,255,.9);box-shadow:0 14px 36px rgba(69,78,111,.18)}.mobile-nav button{border:0;background:transparent;padding:7px 2px;border-radius:13px;font-size:9px;color:#667085}.mobile-nav button.active{background:rgba(92,108,255,.12);color:#5362df;font-weight:900}.mobile-nav b{display:block;font-size:16px;margin-bottom:3px}}
</style>
<script src="../config.js"></script>
</head>
<body>
<div class="app">
<aside class="sidebar">
 <div class="brand"><div class="brand-logo"></div><div><div class="brand-title">Jini ATS <span style="font-size:11px;color:#667085">3.0</span></div><div class="brand-sub">Better People · A Brighter Tomorrow</div></div></div>
 <div class="nav">
  <button class="active" data-page="dashboard"><span class="ico">⌂</span>대시보드</button>
  <button data-page="jobs"><span class="ico">▣</span>채용공고 관리</button>
  <button data-page="candidates"><span class="ico">◉</span>지원자 관리</button>
  <button data-page="analysis"><span class="ico">◎</span>ATS 분석</button>
  <button data-page="reports"><span class="ico">▤</span>리포트</button>
  <button data-page="settings"><span class="ico">⚙</span>설정</button>
 </div>
 <div class="side-card">● 로컬 저장 중<br>채용공고와 지원자 데이터는 현재 브라우저/앱 저장공간에 보관됩니다.</div>
</aside>
<main class="main">
<header class="topbar">
 <div class="search"><span>⌕</span><input id="globalSearch" placeholder="지원자, 채용공고, 키워드로 검색하세요..."></div>
 <div class="top-actions"><button class="btn hide-mobile" id="demoBtn">데모 데이터</button><button class="btn primary" id="newJobBtn">＋ 채용공고 등록</button><div class="avatar">J</div></div>
</header>
<div class="page" id="page"></div>
</main>
</div>
<nav class="mobile-nav" id="mobileNav">
 <button class="active" data-page="dashboard"><b>⌂</b>대시보드</button><button data-page="jobs"><b>▣</b>채용공고</button><button data-page="candidates"><b>◉</b>지원자</button><button data-page="analysis"><b>◎</b>ATS</button><button data-page="reports"><b>▤</b>리포트</button><button data-page="settings"><b>⚙</b>설정</button>
</nav>
<div class="modal" id="modal"><div class="modalbox glass" id="modalBox"></div></div><div class="toast" id="toast"></div>
<script>
const APP_VERSION="3.0.0", STORAGE_KEY="kats";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const GEMINI_API_KEY=String(window.JINI_ATS_CONFIG?.GEMINI_API_KEY||"").trim();
const GEMINI_MODEL=String(window.JINI_ATS_CONFIG?.GEMINI_MODEL||"gemini-2.5-flash").trim();
const stages=["서류접수","서류검토","1차면접","2차면접","최종합격","불합격"];
const demoJobs=[
{id:1,title:"HR Manager",dept:"인사팀",location:"서울",status:"진행중",open:"2026-09-01",close:"2026-09-30",jd:"인사제도 기획 및 운영, 채용, 평가, 보상, 급여, 노무관리, KPI/MBO 성과관리",keywords:["HR","인사기획","채용","평가","보상","급여","노무","KPI","MBO"]},
{id:2,title:"경영지원 HRBP",dept:"경영관리",location:"판교",status:"진행중",open:"2026-09-05",close:"2026-10-05",jd:"HRBP, 인력계획, 인건비 관리, 조직진단, 데이터 기반 HR",keywords:["HRBP","인력계획","인건비","조직진단","채용"]}
];
const demoCandidates=[
{id:101,job:1,name:"김도현",email:"dohyun.kim@example.com",stage:2,years:8,score:92,skills:["인사기획","평가","보상","노무","KPI"],education:"경영학 석사",updated:"오늘",resume:"인사제도 기획과 운영 8년. KPI/MBO 평가체계 구축, 연봉 및 성과보상 운영, 급여와 4대보험, 취업규칙 개정, 채용 전 과정 경험."},
{id:102,job:1,name:"이서연",email:"seoyeon.lee@example.com",stage:1,years:5,score:81,skills:["채용","급여","MBO","조직문화"],education:"심리학 학사",updated:"어제",resume:"채용, 온보딩, 급여, 평가 운영 경험."},
{id:103,job:2,name:"최유진",email:"yujin.choi@example.com",stage:3,years:7,score:89,skills:["HRBP","인력계획","인건비","조직진단"],education:"MBA",updated:"오늘",resume:"사업부 HRBP 7년. 인력계획, 인건비 예산, 조직진단 경험."}
];
let state={jobs:[],candidates:[],page:"dashboard",jobFilter:"all",query:"",aiKey:"",lastSavedAt:null};
function normalize(s={}){return {...state,...s,jobs:Array.isArray(s.jobs)?s.jobs:[],candidates:Array.isArray(s.candidates)?s.candidates:[],page:["dashboard","jobs","candidates","analysis","reports","settings"].includes(s.page)?s.page:"dashboard"}}
function save(){state.lastSavedAt=new Date().toISOString();localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function load(){try{const raw=localStorage.getItem(STORAGE_KEY);state=raw?normalize(JSON.parse(raw)):normalize({jobs:structuredClone(demoJobs),candidates:structuredClone(demoCandidates)});if(!raw)save()}catch{state=normalize({jobs:structuredClone(demoJobs),candidates:structuredClone(demoCandidates)})}render()}
function esc(s){return String(s??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]))}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("show"),2200)}
function go(p){state.page=p;save();render()}
function computeAnalysis(c,j){const kws=j?.keywords||[];const text=((c?.resume||"")+" "+(c?.skills||[]).join(" ")).toLowerCase();const hit=kws.filter(k=>text.includes(String(k).toLowerCase()));const base=kws.length?hit.length/kws.length:0;return {score:Math.min(100,Math.round(base*55+Math.min(25,(+c.years||0)*3)+(/석사|mba|박사/i.test(c.education||"")?10:6)+10)),hit,miss:kws.filter(k=>!hit.includes(k))}}
function render(){
 $$(".nav button,.mobile-nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===state.page));
 ({dashboard:renderDashboard,jobs:renderJobs,candidates:renderCandidates,analysis:renderAnalysis,reports:renderReports,settings:renderSettings}[state.page]||renderDashboard)()
}
function renderDashboard(){
 const total=state.candidates.length, open=state.jobs.filter(j=>j.status==="진행중").length, avg=Math.round(state.candidates.reduce((a,c)=>a+(+c.score||0),0)/Math.max(1,total)), high=state.candidates.filter(c=>(+c.score||0)>=85).length;
 const counts=stages.map((_,i)=>state.candidates.filter(c=>(+c.stage||0)===i).length);
 $("#page").innerHTML=`
 <section class="hero"><div class="hero-main glass"><div class="eyebrow">JINI ATS · IOS 27 EDITION</div><h2>좋은 인재가,<br>더 나은 내일을 만듭니다.</h2><p>채용의 모든 순간을 하나의 흐름으로 관리하세요.</p></div><div class="hero-note glass"><strong>“사람을 연결하는 일이<br>더 좋은 세상을 만듭니다.”</strong></div></section>
 <section class="kpis">${[
 ["진행중 채용",open,"건","20%","▣"],["전체 지원자",total,"명","12%","◉"],["평균 ATS",avg,"점","18%","A"],["추천 후보",high,"명","33%","★"]
 ].map(x=>`<div class="kpi glass"><div class="kpi-top"><div class="kpi-icon">${x[4]}</div><span class="trend">▲ ${x[3]}</span></div><div class="kpi-label">${x[0]}</div><div class="kpi-num">${x[1]} <small>${x[2]}</small></div></div>`).join("")}</section>
 <section class="grid2"><div class="panel glass"><div class="panel-head"><div><h3>채용 파이프라인</h3><p>전체 지원자의 전형별 현황입니다.</p></div></div><div class="pipeline">${stages.map((s,i)=>`<div class="stage ${i===0?"active":""}"><strong>${counts[i]}</strong><span>${s}</span></div>`).join("")}</div><div class="wave"></div></div>
 <div class="panel glass"><div class="panel-head"><div><h3>ATS 분석 현황</h3><p>지원자 직무 적합도 요약</p></div></div><div class="ring-wrap"><div class="ring"><b>${avg}</b></div><div class="bars">${[[90,28],[70,52],[50,16],[0,4]].map(([n,p])=>`<div class="barrow"><span>${n}점+</span><div class="bar"><i style="width:${p}%"></i></div><b>${p}%</b></div>`).join("")}</div></div></div></section>
 <section class="bottom-grid"><div class="panel glass"><div class="panel-head"><div><h3>최근 지원자</h3><p>등록된 지원자</p></div><button class="btn" onclick="go('candidates')">전체보기</button></div><table class="table"><tr><th>이름</th><th>지원 포지션</th><th>ATS</th><th>단계</th></tr>${state.candidates.slice(0,6).map(c=>{const j=state.jobs.find(x=>x.id===c.job);return `<tr><td><b>${esc(c.name)}</b></td><td>${esc(j?.title||"-")}</td><td>${c.score||0}</td><td><span class="pill">${stages[c.stage||0]}</span></td></tr>`}).join("")}</table></div>
 <div class="panel glass"><div class="panel-head"><div><h3>진행중 채용공고</h3><p>현재 모집 중인 포지션</p></div><button class="btn" onclick="go('jobs')">전체보기</button></div>${state.jobs.filter(j=>j.status==="진행중").map(j=>{const n=state.candidates.filter(c=>c.job===j.id).length;return `<div class="jobrow"><div><strong>${esc(j.title)}</strong><br><span>${esc(j.dept)} · ${esc(j.location)}</span></div><b>${n}명</b><div><div class="progress"><i style="width:${Math.min(100,n*12)}%"></i></div></div></div>`}).join("")}</div></section>`
}
function renderJobs(){
 $("#page").innerHTML=`<h2 class="section-title">채용공고 관리</h2><div class="sub">채용 포지션과 JD를 관리합니다.</div><div class="cards">${state.jobs.map(j=>`<article class="jobcard glass"><span class="pill">${esc(j.status)}</span><h3 style="margin-top:12px">${esc(j.title)}</h3><div class="meta">${esc(j.dept)} · ${esc(j.location)}</div><p style="font-size:12px;line-height:1.7;color:#475467">${esc(j.jd)}</p><button class="btn" onclick="openJob(${j.id})">편집</button> <button class="btn" onclick="deleteJob(${j.id})">삭제</button></article>`).join("")}</div>`
}
function renderCandidates(){
 const q=(state.query||"").toLowerCase(); const list=state.candidates.filter(c=>!q||(`${c.name} ${c.email} ${(c.skills||[]).join(" ")}`).toLowerCase().includes(q));
 $("#page").innerHTML=`<h2 class="section-title">지원자 관리</h2><div class="sub">지원자 정보를 확인하고 전형 상태를 관리합니다.</div><div class="cards">${list.map(c=>{const j=state.jobs.find(x=>x.id===c.job);return `<article class="candidatecard glass"><span class="pill">${stages[c.stage||0]}</span><h3 style="margin-top:12px">${esc(c.name)}</h3><div class="meta">${esc(j?.title||"-")} · 경력 ${c.years||0}년</div><p style="font-size:12px">ATS <b>${c.score||0}</b> · ${(c.skills||[]).slice(0,4).map(esc).join(" · ")}</p><button class="btn" onclick="openCandidate(${c.id})">상세</button> <button class="btn" onclick="openAnalysis(${c.id})">ATS 분석</button></article>`}).join("")}</div>`
}
function renderAnalysis(){
 const rows=state.candidates.map(c=>{const j=state.jobs.find(x=>x.id===c.job);const a=computeAnalysis(c,j);return `<tr><td><b>${esc(c.name)}</b></td><td>${esc(j?.title||"-")}</td><td>${a.score}</td><td>${a.hit.map(esc).join(", ")||"-"}</td></tr>`}).join("");
 $("#page").innerHTML=`<h2 class="section-title">ATS 분석</h2><div class="sub">JD 키워드와 지원자의 경력·역량을 비교합니다.</div><div class="panel glass"><table class="table"><tr><th>지원자</th><th>채용공고</th><th>ATS 점수</th><th>매칭 키워드</th></tr>${rows}</table></div>`
}
function renderReports(){
 const avg=Math.round(state.candidates.reduce((a,c)=>a+(+c.score||0),0)/Math.max(1,state.candidates.length));
 $("#page").innerHTML=`<h2 class="section-title">리포트</h2><div class="sub">채용 데이터를 간단히 요약합니다.</div><section class="kpis"><div class="kpi glass"><div class="kpi-label">전체 공고</div><div class="kpi-num">${state.jobs.length}</div></div><div class="kpi glass"><div class="kpi-label">전체 지원자</div><div class="kpi-num">${state.candidates.length}</div></div><div class="kpi glass"><div class="kpi-label">평균 ATS</div><div class="kpi-num">${avg}</div></div><div class="kpi glass"><div class="kpi-label">최종합격</div><div class="kpi-num">${state.candidates.filter(c=>c.stage===4).length}</div></div></section>`
}
function renderSettings(){
 $("#page").innerHTML=`<h2 class="section-title">설정</h2><div class="sub">데이터와 AI 연결을 관리합니다.</div><div class="grid2"><div class="panel glass"><h3>Gemini API</h3><p style="font-size:12px;color:#667085">현재 키 상태: ${getGeminiApiKey()?"연결 준비됨":"키 미입력"}</p><p style="font-size:11px;color:#667085">권장: 프로젝트 루트의 <b>config.js</b>에 키를 입력하세요.</p><button class="btn" onclick="openAISettings()">런타임 키 입력</button></div><div class="panel glass"><h3>데이터 관리</h3><button class="btn" onclick="exportData()">백업 다운로드</button> <button class="btn" onclick="resetAllData()">데이터 초기화</button></div></div>`
}
function openJob(id=0){const j=id?state.jobs.find(x=>x.id===id):{};$("#modalBox").innerHTML=`<h2>${id?"채용공고 수정":"새 채용공고"}</h2><div class="form"><div class="field"><label>공고명</label><input id="jt" value="${esc(j?.title||"")}"></div><div class="field"><label>부서</label><input id="jdpt" value="${esc(j?.dept||"")}"></div><div class="field"><label>근무지</label><input id="jloc" value="${esc(j?.location||"")}"></div><div class="field"><label>JD</label><textarea id="jjd">${esc(j?.jd||"")}</textarea></div><div class="field"><label>키워드</label><input id="jkw" value="${esc((j?.keywords||[]).join(", "))}"></div><div><button class="btn" onclick="closeModal()">취소</button> <button class="btn primary" onclick="saveJob(${id})">저장</button></div></div>`;openModal()}
function saveJob(id){const old=id?state.jobs.find(x=>x.id===id):null;const j={id:id||Date.now(),title:$("#jt").value.trim()||"새 채용공고",dept:$("#jdpt").value.trim(),location:$("#jloc").value.trim(),status:old?.status||"진행중",open:old?.open||new Date().toISOString().slice(0,10),close:old?.close||"",jd:$("#jjd").value.trim(),keywords:$("#jkw").value.split(",").map(x=>x.trim()).filter(Boolean)};state.jobs=id?state.jobs.map(x=>x.id===id?j:x):[...state.jobs,j];save();closeModal();render();toast("채용공고가 저장되었습니다.")}
function deleteJob(id){if(!confirm("채용공고를 삭제하시겠습니까?"))return;state.jobs=state.jobs.filter(x=>x.id!==id);state.candidates=state.candidates.filter(c=>c.job!==id);save();render()}
function openCandidate(id){const c=state.candidates.find(x=>x.id===id);$("#modalBox").innerHTML=`<h2>지원자 상세</h2><div class="form"><div class="field"><label>이름</label><input id="cn" value="${esc(c.name)}"></div><div class="field"><label>이메일</label><input id="ce" value="${esc(c.email||"")}"></div><div class="field"><label>경력연수</label><input id="cy" type="number" value="${c.years||0}"></div><div class="field"><label>학력</label><input id="ced" value="${esc(c.education||"")}"></div><div class="field"><label>스킬</label><input id="csk" value="${esc((c.skills||[]).join(", "))}"></div><div class="field"><label>이력서 원문</label><textarea id="cr">${esc(c.resume||"")}</textarea></div><div><button class="btn" onclick="closeModal()">취소</button> <button class="btn primary" onclick="saveCandidate(${id})">저장</button></div></div>`;openModal()}
function saveCandidate(id){const c=state.candidates.find(x=>x.id===id), j=state.jobs.find(x=>x.id===c.job);const n={...c,name:$("#cn").value.trim(),email:$("#ce").value.trim(),years:+$("#cy").value||0,education:$("#ced").value.trim(),skills:$("#csk").value.split(",").map(x=>x.trim()).filter(Boolean),resume:$("#cr").value.trim()};n.score=computeAnalysis(n,j).score;state.candidates=state.candidates.map(x=>x.id===id?n:x);save();closeModal();render();toast("지원자가 저장되었습니다.")}
function openAnalysis(id){state.page="analysis";save();render();toast("ATS 분석 화면으로 이동했습니다.")}
function openModal(){$("#modal").classList.add("open")} function closeModal(){$("#modal").classList.remove("open")}
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()})
function getGeminiApiKey(){return String(state.aiKey||GEMINI_API_KEY||"").trim()}
function openAISettings(){$("#modalBox").innerHTML=`<h2>Gemini API 설정</h2><div class="field"><label>API Key</label><input id="runtimeKey" type="password" value="${esc(state.aiKey||"")}" placeholder="AIza..."></div><p style="font-size:11px;color:#667085">임시 테스트용입니다. 공개 GitHub에는 키를 저장하지 마세요.</p><button class="btn" onclick="closeModal()">취소</button> <button class="btn primary" onclick="state.aiKey=$('#runtimeKey').value.trim();save();closeModal();toast('API 키가 저장되었습니다.')">저장</button>`;openModal()}
async function analyzeResumeWithGemini(text,jd,file){
 const apiKey=getGeminiApiKey(); if(!apiKey)throw new Error("Gemini API Key가 없습니다.");
 const parts=[{text:`당신은 대한민국 기업의 전문 HR 채용담당자다. 아래 이력서를 JSON으로 구조화하라. 추측하지 말고 사실만 사용하라. JSON 필드: name,email,phone,years,education,skills,careerSummary,keyCareers,concerns. 지원 JD:${jd||"없음"} 이력서:${text||""}`}];
 if(file){const b=new Uint8Array(await file.arrayBuffer());let s="";for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode(...b.subarray(i,Math.min(i+0x8000,b.length)));parts.push({inlineData:{mimeType:"application/pdf",data:btoa(s)}})}
 const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`,{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":apiKey},body:JSON.stringify({contents:[{parts}],generationConfig:{responseMimeType:"application/json"}})});
 const data=await r.json(); if(!r.ok)throw new Error(data?.error?.message||`Gemini 오류 ${r.status}`);const out=(data.candidates||[]).flatMap(c=>c.content?.parts||[]).map(p=>p.text||"").join("");return JSON.parse(out)
}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="jini-ats-backup.json";a.click();URL.revokeObjectURL(a.href)}
function resetAllData(){if(!confirm("모든 채용 데이터를 초기화하시겠습니까?"))return;state=normalize({jobs:[],candidates:[],page:"settings",aiKey:state.aiKey});save();render()}
$("#newJobBtn").onclick=()=>openJob();
$("#demoBtn").onclick=()=>{if(!confirm("현재 데이터를 데모 데이터로 교체할까요?"))return;state=normalize({jobs:structuredClone(demoJobs),candidates:structuredClone(demoCandidates),page:"dashboard",aiKey:state.aiKey});save();render()}
$$(".nav button,.mobile-nav button").forEach(b=>b.onclick=()=>go(b.dataset.page));
$("#globalSearch").addEventListener("input",e=>{state.query=e.target.value; if(state.page!=="candidates")state.page="candidates";render()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
load();
</script>
</body></html>
